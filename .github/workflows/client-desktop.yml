name: Client Desktop Build

on:
  push:
    branches: [client]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
            artifact: coreor-database-windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            artifact: coreor-database-macos
            paths: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x64
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: coreor-database-linux
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Desktop-only architecture
        run: npm run desktop:check

      - name: Generate platform icons
        run: npm run icons:ensure

      - name: TypeScript
        run: npm run typecheck

      - name: Native Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Static desktop UI build
        run: npm run build:ui

      - name: Build native desktop bundle
        run: npx --no-install tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.paths }}

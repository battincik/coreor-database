name: Desktop Client Check

on:
  push:
    branches: [client]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-check:
    name: Check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Desktop architecture guard
        run: npm run desktop:check

      - name: Generate platform icons
        run: npm run icons:ensure

      - name: TypeScript check
        run: npm run typecheck

      - name: Static desktop UI build
        run: npm run build:ui

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Native compile without bundle
        run: npx --no-install tauri build --no-bundle

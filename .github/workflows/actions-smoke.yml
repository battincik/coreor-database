name: Actions smoke

on:
  push:
    branches: [client]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: GitHub-hosted runner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify runner startup
        run: |
          echo "GitHub Actions runner started successfully."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "SHA: $GITHUB_SHA"

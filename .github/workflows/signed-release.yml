name: Signed release candidate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a pre-created release tag on the exact selected commit
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          echo "Verifying ${tag} matches ${GITHUB_SHA}"
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}" || { echo "::error::Tag ${tag} is missing. Push it from a trusted workstation before running release."; exit 1; }
          actual=$(git rev-list -n 1 "${tag}")
          test "${actual}" = "${GITHUB_SHA}" || { echo "::error::Tag ${tag} points to ${actual}, expected ${GITHUB_SHA}"; exit 1; }
          echo "Release tag ${tag} is valid"
  release:
    needs: preflight
    strategy:
      fail-fast: false
      # Serialize asset/manifest uploads to a shared draft.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            target: ''
          - os: ubuntu-22.04
            args: --bundles appimage
            target: ''
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      COREOR_UPDATER_PUBLIC_KEY: ${{ vars.COREOR_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/prepare-signed-release.mjs
      - run: npm run check
      - run: npm run test:lifecycle
      - run: npm run test:release
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Coreor Database v__VERSION__
          releaseBody: Coreor Database v__VERSION__ — büyük şema performansı, yeni yerleşimler, SQL editörü tercihleri ve imzalı güncelleme altyapısı. Bu taslak doğrulanmadan yayımlanmaz.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
  verify-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Required to discover the draft created by the release matrix.
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test release manifest repair rules
        run: node --test tests/release-metadata.test.mjs
      - name: Repair draft updater manifest URLs and release notes
        run: node scripts/repair-release-metadata.mjs
      - name: Verify draft updater manifest and assets via GitHub API
        run: node scripts/verify-draft-release.mjs

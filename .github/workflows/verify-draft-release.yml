name: Verify draft release
on:
  workflow_dispatch:
permissions:
  # GitHub REST API hides draft releases from tokens without write access.
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify existing draft or published release without rebuilding platforms
        run: node scripts/verify-draft-release.mjs

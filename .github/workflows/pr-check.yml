name: Pull Request Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: gold-vm
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Runtime versions
        run: |
          node --version
          npm --version

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXTAUTH_SECRET: pr-check-only-secret
          NEXTAUTH_URL: http://localhost:3302
          GITHUB_ID: pr-check-placeholder
          GITHUB_SECRET: pr-check-placeholder
          DATABASE_ALLOWED_HOSTS: 127.0.0.1

name: Sync v26.11.3 release notes

on:
  push:
    branches: [main]
    paths:
      - docs/releases/v26.11.3.md
      - .github/workflows/sync-v26-11-3-release-notes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Update existing v26.11.3 draft description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only the existing v26.11.3 draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token = process.env.GH_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const id = 445283903;
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json'
          };
          const url = `https://api.github.com/repos/${repo}/releases/${id}`;
          const get = await fetch(url, { headers });
          if (!get.ok) throw Error(`Could not read release: HTTP ${get.status}`);
          const release = await get.json();
          if (repo !== 'battincik/coreor-database' || release.tag_name !== 'v26.11.3' || release.name !== 'Coreor Database v26.11.3') {
            throw Error('Refusing to edit unexpected release');
          }
          const body = fs.readFileSync('docs/releases/v26.11.3.md', 'utf8').trim();
          if (release.body?.trim() !== body) {
            const put = await fetch(url, {
              method: 'PATCH', headers,
              body: JSON.stringify({ body })
            });
            if (!put.ok) throw Error(`GitHub release update failed: HTTP ${put.status} ${(await put.text()).slice(0, 300)}`);
          }
          const verify = await fetch(url, { headers });
          if (!verify.ok || (await verify.json()).body?.trim() !== body) throw Error('Release description readback did not match');
          console.log(`v26.11.3 release ${id}: notes synchronized and verified`);
          NODE

[package]
name = "coreor-databas"
version = "26.9.1"
description = "Cross-platform local-first database client"
authors = ["Coreor Database contributors"]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/battincik/coreor-database"
homepage = "https://github.com/battincik/coreor-database"

[lib]
name = "coreor_database_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "rt"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "sql-browser-tokio", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

base64 = "0.22"
ring = "0.17.14"
urlencoding = "2.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
webview2-com = "0.38.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11.1"
